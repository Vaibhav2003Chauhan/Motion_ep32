; PlatformIO Project Configuration File

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = espidf
monitor_speed = 115200
upload_speed = 921600
; Uncomment the next line to use SPI instead of I2C
; build_flags = -DLIS3DH_USE_SPI
extra_scripts = post:copy_firmware.py

; ---- Custom partition: 1.97MB app (BLE + WiFi + TLS need space) ----
board_build.partitions = partitions.csv
